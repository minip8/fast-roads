<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Roads</title>
<meta name="description" content="Time-trial racing on real circuit layouts, in the browser: a 2026 F1 car, a GT3 and a drift car at every circuit on the 2026 F1 calendar, with lap and sector timing.">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" hidden>
  <div id="timing" class="panel">
    <div class="trk"><span id="trkName"></span> · <span id="trkLen"></span></div>
    <div id="lapTime" class="num">-:--.---</div>
    <div id="lapState">OUT LAP</div>
    <div id="delta" class="num"></div>
    <div class="sectors">
      <div class="sec" id="sec0"><span>S1</span><b class="num">—</b></div>
      <div class="sec" id="sec1"><span>S2</span><b class="num">—</b></div>
      <div class="sec" id="sec2"><span>S3</span><b class="num">—</b></div>
    </div>
    <div class="row"><span>LAST</span><b id="lastLap" class="num">—</b></div>
    <div class="row"><span>BEST</span><b id="bestLap" class="num">—</b></div>
    <div class="row"><span>OPTIMAL</span><b id="optLap" class="num">—</b></div>
    <div id="lapList" class="num"></div>
  </div>
  <canvas id="minimap" class="panel" width="440" height="440"></canvas>
  <div id="dash" class="panel">
    <div id="shiftLights"></div>
    <div id="dashrow">
      <div id="pedals" title="Throttle / brake">
        <div class="pedal"><div id="thrFill"></div></div>
        <div class="pedal"><div id="brkFill"></div></div>
      </div>
      <div id="gear" class="num">N</div>
      <div class="spd"><div id="speed" class="num">0</div><div class="unit" id="speedUnit">KM/H</div></div>
    </div>
    <div id="flags"></div>
  </div>
  <div id="msg" class="panel"></div>
  <div id="mouseSteer" hidden><div id="mouseSteerKnob"></div></div>
  <div id="help" class="panel"></div>
  <div id="helpChip" class="panel"></div>
  <div id="fps" class="panel num" hidden></div>
</div>

<div id="overlay">
  <div id="menu" role="dialog" aria-label="Menu">
    <header class="mhead">
      <div class="brand">
        <h1>FAST ROADS <span id="menuPaused" hidden>Paused</span></h1>
        <p class="sub" id="menuSub">Time trial</p>
      </div>
      <div class="menu-actions" id="menuActions"></div>
    </header>
    <p id="loadState">Loading physics…</p>
    <div id="menuBody" hidden>
      <nav id="menuTabs" class="seg tabs" role="tablist"></nav>
      <div id="menuContent"></div>
      <p class="menu-hint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>←</kbd><kbd>→</kbd> change · <kbd>Enter</kbd> select · <kbd>Esc</kbd> resume · gamepad: d-pad, A, B, LB / RB</p>
    </div>
  </div>
</div>

<script type="module" src="/src/boot.ts"></script>
</body>
</html>
